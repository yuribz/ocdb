<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
        (function () {
            var theme = localStorage.getItem("ocdb-theme");
            if (theme === "light" || theme === "dark") {
                document.documentElement.setAttribute("data-theme", theme);
            }
        })();
    </script>
    <title>OCDB — Original Character Database</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="centered-parent">
    <div class="theme-switcher">
        <label for="theme-select">Theme:</label>
        <select id="theme-select">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
        </select>
    </div>

    <div class="box">
        <h1>OCDB</h1>
        <p>Original Character Database</p>

        <section id="characters">
            <h2>Characters</h2>
            <input type="search" id="character-search" class="search-input"
                   placeholder="Search characters..." aria-label="Search characters" />
            <ul id="character-list" class="entity-list"></ul>
            <p id="character-empty-state" class="empty-state" hidden>
                No characters yet — add your first OC!
            </p>
            <button type="button" id="new-character-button" class="btn">+ New Character</button>
        </section>

        <section id="places">
            <h2>Places</h2>
            <input type="search" id="place-search" class="search-input"
                   placeholder="Search places..." aria-label="Search places" />
            <ul id="place-list" class="entity-list"></ul>
            <p id="place-empty-state" class="empty-state" hidden>
                No places yet — add your first location!
            </p>
            <button type="button" id="new-place-button" class="btn">+ New Place</button>
        </section>
    </div>

    <!-- One shell handles view, edit, and create for a character (see modal.js
         createEntityModal). Field rows/inputs below are generated at runtime
         from entity_schemas.js's characterSchema, not hand-written here. -->
    <div id="character-modal" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="character-modal-title">

            <!-- Buttons at the top -->
            <button type="button" class="modal-edit btn" aria-label="Edit">Edit</button>
            <button type="button" class="modal-close" aria-label="Close">&times;</button>

            <!-- View mode -->
            <h2 class="modal-title" id="character-modal-title"></h2>
            <div class="cover-image modal-cover-image"></div>
            <dl class="modal-view"></dl>

            <!-- Edit / create mode -->
            <form class="modal-form">
                <div class="modal-form-fields"></div>
                <div class="modal-form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="modal-cancel btn">Cancel</button>
                </div>
                <p class="modal-form-error upload-error"></p>
            </form>

            <!-- Pronoun sets are a character sub-resource (character_id FK),
                 not their own top-level entity, so they're managed inline
                 here rather than through a separate modal. -->
            <section class="modal-pronouns-section">
                <h3>Pronouns</h3>
                <ul id="pronoun-list" class="pronoun-list"></ul>

                <form id="pronoun-form" class="pronoun-form" hidden>
                    <input type="hidden" id="pronoun-form-id" />
                    <label for="pronoun-subject">Subject
                        <input type="text" id="pronoun-subject" name="subject" required />
                    </label>
                    <label for="pronoun-object">Object
                        <input type="text" id="pronoun-object" name="object" required />
                    </label>
                    <label for="pronoun-possessive">Possessive
                        <input type="text" id="pronoun-possessive" name="possessive" required />
                    </label>
                    <label for="pronoun-possessive_determiner">Possessive determiner
                        <input type="text" id="pronoun-possessive_determiner" name="possessive_determiner" required />
                    </label>
                    <label for="pronoun-reflexive">Reflexive
                        <input type="text" id="pronoun-reflexive" name="reflexive" required />
                    </label>
                    <label for="pronoun-is_primary">
                        <input type="checkbox" id="pronoun-is_primary" name="is_primary" />
                        Primary
                    </label>
                    <button type="submit" class="btn btn-primary">Save pronoun set</button>
                    <button type="button" id="pronoun-form-cancel" class="btn">Cancel</button>
                    <p id="pronoun-form-error" class="upload-error"></p>
                </form>

                <button type="button" id="pronoun-add-button" class="btn">+ Add pronoun set</button>
            </section>

            <section class="modal-gallery-section">
                <h3>Gallery</h3>
                <div id="modal-image-gallery" class="gallery-grid"></div>

                <form id="upload-form" class="upload-form">
                    <label for="upload-file">Image</label>
                    <input type="file" id="upload-file" name="file"
                           accept="image/png,image/jpeg,image/webp,image/gif" required />

                    <label for="upload-caption">Caption (optional)</label>
                    <input type="text" id="upload-caption" name="caption" />

                    <label for="upload-primary">
                        <input type="checkbox" id="upload-primary" name="is_primary" value="true" />
                        Set as cover image
                    </label>

                    <button type="submit" class="btn btn-primary">Upload</button>
                    <p id="upload-error" class="upload-error"></p>
                </form>
            </section>
        </div>
    </div>

    <!-- Places has no image-linking backend support, so this shell omits the
         cover-image/gallery markup the character modal has. -->
    <div id="place-modal" class="modal-overlay" hidden>
        <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="place-modal-title">

            <button type="button" class="modal-edit btn" aria-label="Edit">Edit</button>
            <button type="button" class="modal-close" aria-label="Close">&times;</button>

            <h2 class="modal-title" id="place-modal-title"></h2>
            <dl class="modal-view"></dl>

            <form class="modal-form">
                <div class="modal-form-fields"></div>
                <div class="modal-form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="modal-cancel btn">Cancel</button>
                </div>
                <p class="modal-form-error upload-error"></p>
            </form>
        </div>
    </div>

    <!-- Toasts are appended/removed here at runtime by js/toast.js. -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Full-size viewer for a clicked gallery thumbnail. Same
         overlay/Escape-to-close pattern as the entity modals (see
         initModal in modal.js), driven by js/lightbox.js. -->
    <div id="image-lightbox" class="lightbox-overlay" hidden>
        <div class="lightbox-box">
            <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
            <img class="lightbox-image" src="" alt="" />
            <p class="lightbox-caption"></p>
        </div>
    </div>

    <script src="/js/theme.js"></script>
    <script type="module" src="/js/app.js"></script>
</body>
</html>
