services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ocdb
      POSTGRES_PASSWORD: ocdb
      POSTGRES_DB: ocdb
    ports:
      - "5433:5432"
    volumes:
      - ocdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ocdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ocdb-minio
      MINIO_ROOT_PASSWORD: ocdb-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ocdb-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  backup:
    build: ./scripts
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ocdb-backups:/backups
    environment:
      PGHOST: db
      PGUSER: ocdb
      PGPASSWORD: ocdb
      PGDATABASE: ocdb
      BACKUP_DIR: /backups
      RETENTION_DAYS: 14
      BACKUP_INTERVAL_SECONDS: 86400

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ocdb:ocdb@db:5432/ocdb
      PORT: 3000
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_URL_BASE: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ocdb-images
      S3_ACCESS_KEY_ID: ocdb-minio
      S3_SECRET_ACCESS_KEY: ocdb-minio-secret
    ports:
      - "3000:3000"

volumes:
  ocdb-data:
  ocdb-minio-data:
  ocdb-backups:
